<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Caption Settings</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        padding: 16px;
        margin: 0;
        width: 250px;
        color: #333;
      }
      h2 {
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 16px;
        text-align: center;
      }
      .control-group {
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
      }
      label {
        margin-bottom: 4px;
        font-size: 14px;
      }
      input[type="range"] {
        width: 100%;
        margin: 6px 0;
      }
      input[type="color"] {
        width: 100%;
        height: 30px;
        padding: 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      /* Toggle button - Start state (blue) */
      #toggleBtn {
        background-color: #2563eb; /* Tailwind blue-600 */
        color: #ffffff;
      }
      #toggleBtn:hover {
        background-color: #1d4ed8; /* Tailwind blue-700 */
      }
      /* Toggle button - Stop state (red) */
      #toggleBtn.recording {
        background-color: #dc2626; /* Tailwind red-600 */
        color: #ffffff;
      }
      #toggleBtn.recording:hover {
        background-color: #b91c1c; /* Tailwind red-700 */
      }
      /* Clear Captions button styling */
      #clearCaptionsBtn {
        background-color: #4b5563; /* Tailwind gray-600 */
        color: #ffffff;
      }
      #clearCaptionsBtn:hover {
        background-color: #374151; /* Tailwind gray-700 */
      }
      .popupContainer {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div class="popupContainer">
      <h2>Caption Settings</h2>

      <div class="control-group">
        <label for="textSize">Text Size:</label>
        <input type="range" id="textSize" min="1" max="14" value="1.8" />
      </div>

      <div class="control-group">
        <label for="lineHeight">Line Height:</label>
        <input type="range" id="lineHeight" min="1" max="14" value="1.4" />
      </div>

      <div class="control-group">
        <label for="bgColor">Background Color:</label>
        <input type="color" id="bgColor" value="#000000" />
      </div>

      <div class="control-group">
        <label for="textColor">Text Color:</label>
        <input type="color" id="textColor" value="#ffffff" />
      </div>

      <button id="toggleBtn">Start</button>
      <button id="clearCaptionsBtn">Clear Captions</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
