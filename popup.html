<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Caption Settings</title>
    <style>
      /* Basic styling for the popup */
      body {
        font-family: Arial, sans-serif;
        width: 300px;
        margin: 10px;
      }
      h2 {
        text-align: center;
      }
      label {
        display: block;
        margin-top: 10px;
      }
      input[type="range"],
      input[type="color"] {
        width: 100%;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Caption Settings</h2>

    <label for="textSize">
      Text Size:
      <input type="range" id="textSize" min="1" max="14" value="1.8" />
    </label>

    <label for="lineHeight">
      Line Height:
      <input type="range" id="lineHeight" min="1" max="14" value="1.4" />
    </label>

    <label for="bgColor">
      Background Color:
      <input type="color" id="bgColor" value="#000000" />
    </label>

    <label for="textColor">
      Text Color:
      <input type="color" id="textColor" value="#ffffff" />
    </label>

    <button id="startStopBtn">Start</button>
    <button id="stopBtn">Stop</button>

    <button id="clearCaptionsBtn">Clear Captions</button>

    <script src="popup.js"></script>
  </body>
</html>
